services:
  expo:
    build:
      context: ./src
      target: dev
    working_dir: /app
    command: npm run start:lan
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://10.0.2.2:8000/api/v1}
      # Not set here on purpose: the Expo CLI (SDK 57+) refuses to boot if
      # personal/machine-specific vars like this one live in the shared
      # .env, so it belongs in .env.local instead — which is bind-mounted
      # into the container and loaded directly by the CLI. Setting a real
      # process env var here (even an empty default) would take precedence
      # over .env.local's value and silently break LAN detection.
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    volumes:
      - ./src:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

  expo-tunnel:
    build:
      context: ./src
      target: dev
    working_dir: /app
    command: npm run start:tunnel
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://10.0.2.2:8000/api/v1}
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./src:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    profiles:
      - tunnel

  web:
    build:
      context: ./src
      target: web
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-/api/v1}
    ports:
      - "8088:80"
    profiles:
      - web

volumes:
  mobile_node_modules:
